<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#667eea">
  <title>Sign Asili - Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mobile-container {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    .mobile-header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .mobile-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .mobile-nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .mobile-nav-item {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 15px;
      padding: 20px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .mobile-nav-item:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
    }

    .mobile-nav-item .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 10px;
    }

    .quick-actions {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
    }

    .quick-actions h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .action-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-button.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .action-button.secondary {
      background: #f0f0f0;
      color: #333;
    }

    .action-button:active {
      transform: scale(0.98);
    }

    .voice-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin: 20px auto;
      display: block;
    }

    .voice-button.listening {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @media (max-width: 375px) {
      .mobile-nav {
        grid-template-columns: 1fr;
      }
      
      .mobile-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="mobile-header">
      <h1>🤟 Sign Asili</h1>
      <p>Learn Kenyan Sign Language</p>
    </div>

    <div class="mobile-nav">
      <button class="mobile-nav-item" onclick="location.href='/grade1.html'">
        <span class="icon">📚</span>
        Lessons
      </button>
      <button class="mobile-nav-item" onclick="location.href='/asili-talk.html'">
        <span class="icon">🎤</span>
        Voice Mode
      </button>
      <button class="mobile-nav-item" onclick="location.href='/sign-practice.html'">
        <span class="icon">🤚</span>
        Practice
      </button>
      <button class="mobile-nav-item" onclick="location.href='/games/memory.html'">
        <span class="icon">🎮</span>
        Games
      </button>
    </div>

    <div class="quick-actions">
      <h2>Quick Actions</h2>
      <button class="action-button primary" onclick="startVoice()">🎤 Start Voice Search</button>
      <button class="action-button secondary" onclick="showProgress()">📊 View Progress</button>
      <button class="action-button secondary" onclick="showTutorial()">📖 How to Use</button>
    </div>
  </div>

  <script>
    function startVoice() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        window.location.href = '/asili-talk.html';
      } else {
        alert('Voice recognition not supported on this device');
      }
    }

    function showProgress() {
      const progress = JSON.parse(localStorage.getItem('signAsili_progress') || '{}');
      alert(`Stars: ${progress.stars || 0}\nGems: ${progress.gems || 0}`);
    }

    function showTutorial() {
      alert('Tap any button to start learning. Use voice mode to speak and see signs!');
    }
  </script>
</body>
</html>
